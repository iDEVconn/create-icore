name: CI

# Minimal Nx affected pipeline for a project scaffolded by create-icore.
# Runs the same checks on every PR and on every push to main/dev — it
# does not deploy anything; wire up your own deploy job when you're ready.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Affected lint, test, build
        run: npx nx affected -t lint test build --parallel

      # --api=graphql|both projects only (no project has the target in a rest project): the GraphQL
      # documents must still validate against the gateway schema. `graphql-codegen` first emits the
      # schema (`api:graphql-schema`), then checks every .graphql operation and rewrites
      # src/gql/types.ts; commit that file after changing an operation or a resolver.
      - name: GraphQL operations match the schema
        run: |
          for p in $(npx nx show projects --with-target graphql-codegen | tr -d '[]"' | tr ',\n' '  '); do
            npx nx run "$p:graphql-codegen"
          done
