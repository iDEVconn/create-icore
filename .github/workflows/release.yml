name: Release

# On push to main, changesets/action opens / refreshes a "Version Packages"
# PR. When that PR merges (no pending changesets), the action runs
# `changeset publish` which publishes @idevconn/create-icore to npm
# with sigstore provenance attestation (repo is public — requirement
# satisfied).
#
# `workflow_dispatch` stays available as a manual override (e.g. retry
# a failed publish without an extra commit).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build CLI
        run: yarn nx build create-icore
      - name: Clean deprecated npm config
        run: |
          npm config delete always-auth --location=user 2>/dev/null || true
          npm config delete always-auth --location=project 2>/dev/null || true
          rm -f .npmrc
      - name: Ensure npm has OIDC trusted publishing support
        run: npm install -g npm@latest
      - name: Create Release PR or publish
        id: changesets
        # Pinned to v2.1.2's commit (not the floating v1/v2 tag) — v1 only
        # supports @changesets/cli v2 (see the action's own README: "This is
        # the development branch for changesets/action v2 compatible with
        # Changesets v3"). This repo bumped @changesets/cli to ^3.0.1 while
        # still on changesets/action@v1, which silently stopped pushing git
        # tags/GitHub Releases for 4 releases (0.14.0-0.15.0 published to npm
        # fine, but no tag/release ever landed) — v1's tag-push path doesn't
        # know CLI v3's renamed `changeset git-tag` command. v2 also defaults
        # push-with-git-cli to false (pushes via the GitHub API instead of a
        # local git push), which is the more likely actual fix.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npx changeset publish
          version-script: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance attestation triggers npm's quarantine flag, which yarn 4
          # treats as "tag latest is quarantined" until npm's transparency-log
          # replicates (~30-60 min). That window is unusable from yarn create.
          # Disabled until npm/yarn align — re-enable when consumers stop
          # tripping over the quarantine.
          NPM_CONFIG_PROVENANCE: 'false'
      - name: Trigger sync-main-to-dev workflow
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-main-to-dev.yml --ref main
